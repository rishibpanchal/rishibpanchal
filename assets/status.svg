<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 145" width="100%" height="auto">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap');
      .bg { fill: #0B0C0E; }
      .border { stroke: #232730; stroke-width: 1; fill: none; }
      .divider { stroke: #1D212A; stroke-width: 1; }
      .header-mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; fill: #717684; letter-spacing: 1px; }
      .status-pulse { fill: #10B981; }
      .col-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; fill: #FF4D00; }
      .col-title { font-family: 'Space Grotesk', -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #F4F4F5; }
      .col-desc { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #8E9299; }
    </style>
  </defs>

  <rect width="960" height="145" rx="8" class="bg" />
  <rect x="0.5" y="0.5" width="959" height="144" rx="7.5" class="border" />

  <!-- Top Telemetry Bar -->
  <g transform="translate(30, 24)">
    <circle cx="0" cy="0" r="4" class="status-pulse" />
    <text x="12" y="4" class="header-mono">TELEMETRY // LIVE STATUS BOARD // 2026.09</text>
    <text x="730" y="4" class="header-mono" fill="#10B981">DISPATCH: ACTIVE</text>
  </g>

  <line x1="30" y1="40" x2="930" y2="40" stroke="#1A1D24" stroke-width="1" />

  <!-- 4 Columns -->
  <!-- Col 1: Building -->
  <g transform="translate(30, 62)">
    <text x="0" y="0" class="col-tag">BUILDING →</text>
    <text x="0" y="24" class="col-title">Transaction Cores</text>
    <text x="0" y="44" class="col-desc">Java 21 Loom settlement</text>
  </g>

  <line x1="250" y1="52" x2="250" y2="125" class="divider" />

  <!-- Col 2: Reading -->
  <g transform="translate(270, 62)">
    <text x="0" y="0" class="col-tag">READING →</text>
    <text x="0" y="24" class="col-title">Database Internals</text>
    <text x="0" y="44" class="col-desc">WAL &amp; MVCC isolation</text>
  </g>

  <line x1="490" y1="52" x2="490" y2="125" class="divider" />

  <!-- Col 3: Breaking -->
  <g transform="translate(510, 62)">
    <text x="0" y="0" class="col-tag">BREAKING →</text>
    <text x="0" y="24" class="col-title">Lock Assumptions</text>
    <text x="0" y="44" class="col-desc">Contention &amp; thread starvation</text>
  </g>

  <line x1="720" y1="52" x2="720" y2="125" class="divider" />

  <!-- Col 4: Exploring -->
  <g transform="translate(740, 62)">
    <text x="0" y="0" class="col-tag">EXPLORING →</text>
    <text x="0" y="24" class="col-title">Agent Governance</text>
    <text x="0" y="44" class="col-desc">Deterministic guardrails</text>
  </g>
</svg>
