<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" width="100%" height="auto">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap');
      .bg { fill: #0B0C0E; }
      .card-border { stroke: #232730; stroke-width: 1; fill: none; }
      .num { font-family: 'Space Grotesk', -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #3B82F6; letter-spacing: 1px; }
      .title { font-family: 'Space Grotesk', -apple-system, sans-serif; font-size: 32px; font-weight: 900; fill: #F4F4F5; letter-spacing: -1px; }
      .subtitle { font-family: 'Space Grotesk', -apple-system, sans-serif; font-size: 14px; font-weight: 500; fill: #8E9299; }
      .mono-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; fill: #D4D4D8; }
      .tag-bg { fill: #161920; stroke: #2B303C; stroke-width: 1; }
      .diag-bg { fill: #101217; stroke: #1D212A; stroke-width: 1; }
      .diag-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #A1A1AA; }
      .diag-accent { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; fill: #3B82F6; }
      .diag-box { fill: #14171F; stroke: #2E3442; stroke-width: 1; rx: 4px; }
      .bar-opt { fill: #EF4444; }
      .bar-pess { fill: #10B981; }
      .diag-line { stroke: #333948; stroke-width: 1; }
    </style>
  </defs>

  <rect width="960" height="270" rx="10" class="bg" />
  <rect x="0.5" y="0.5" width="959" height="269" rx="9.5" class="card-border" />

  <!-- Left Side: Editorial Details -->
  <g transform="translate(40, 36)">
    <text x="0" y="0" class="num">03 // TRANSACTION ISOLATION &amp; BENCHMARKING</text>
    <text x="0" y="34" class="title">TRANSACTX</text>
    <text x="0" y="58" class="subtitle">Banking core with concurrency benchmarking sandbox</text>

    <!-- Technical Badges -->
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="85" height="22" rx="4" class="tag-bg" />
      <text x="8" y="15" class="mono-tag">SPRING BOOT</text>

      <rect x="93" y="0" width="95" height="22" rx="4" class="tag-bg" />
      <text x="101" y="15" class="mono-tag">POSTGRESQL</text>

      <rect x="196" y="0" width="55" height="22" rx="4" class="tag-bg" />
      <text x="204" y="15" class="mono-tag">REDIS</text>

      <rect x="259" y="0" width="135" height="22" rx="4" class="tag-bg" />
      <text x="267" y="15" class="mono-tag">DOUBLE-ENTRY LEDGER</text>
    </g>

    <g transform="translate(0, 130)">
      <text x="0" y="0" class="diag-label" font-size="12px">CORE INVARIANT:</text>
      <text x="0" y="20" class="diag-accent" font-size="12px">Balances never mutate directly; all moves write debit/credit pairs.</text>
      <text x="0" y="38" class="diag-label">Built-in concurrency harness pits @Version against PESSIMISTIC_WRITE.</text>
      <text x="0" y="56" class="diag-label">Redis-backed idempotency tokens prevent double-spend retries.</text>
    </g>
  </g>

  <!-- Right Side: Locking Sandbox Comparison Chart -->
  <g transform="translate(480, 24)">
    <rect width="440" height="222" rx="6" class="diag-bg" />

    <!-- Top Diagram Label -->
    <text x="20" y="26" class="diag-accent">CONCURRENCY SANDBOX // OPTIMISTIC VS. PESSIMISTIC UNDER LOAD</text>

    <!-- Visual Benchmarking Bars -->
    <g transform="translate(20, 50)">
      <!-- Optimistic Locking Profile -->
      <text x="0" y="14" class="diag-label">OPTIMISTIC (@Version): High conflict abort rate under write contention</text>
      <rect x="0" y="22" width="300" height="12" rx="2" fill="#20242D" />
      <rect x="0" y="22" width="235" height="12" rx="2" class="bar-opt" opacity="0.85" />
      <text x="310" y="32" class="diag-label" fill="#EF4444">78% Conflict Aborts</text>

      <!-- Pessimistic Locking Profile -->
      <text x="0" y="66" class="diag-label">PESSIMISTIC (PESSIMISTIC_WRITE): Ordered row locks with 0% deadlocks</text>
      <rect x="0" y="74" width="300" height="12" rx="2" fill="#20242D" />
      <rect x="0" y="74" width="290" height="12" rx="2" class="bar-pess" opacity="0.85" />
      <text x="310" y="84" class="diag-label" fill="#10B981">99.9% Completed</text>
    </g>

    <!-- Idempotency & Audit Architecture -->
    <g transform="translate(20, 160)">
      <rect x="0" y="0" width="190" height="38" rx="4" class="diag-box" />
      <text x="10" y="16" class="diag-label">REDIS IDEMPOTENCY</text>
      <text x="10" y="28" class="diag-accent">Token Dedup: 0% duplicate spend</text>

      <rect x="205" y="0" width="195" height="38" rx="4" class="diag-box" />
      <text x="215" y="16" class="diag-label">AUDIT ISOLATION</text>
      <text x="215" y="28" class="diag-accent">REQUIRES_NEW survival on rollback</text>
    </g>

    <text x="20" y="212" class="diag-label">VERIFIED: Multi-threaded stress tested with Java virtual thread workers</text>
  </g>
</svg>
