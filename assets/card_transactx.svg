<svg xmlns="http://www.w3.org/2000/svg" width="860" height="232" viewBox="0 0 860 232"><style>
.t{font-family:Manrope, 'Segoe UI', Helvetica, Arial, sans-serif}
@keyframes a{0%,100%{transform:translateX(0);opacity:.8}50%{transform:translateX(300px);opacity:1}}
@keyframes b{0%,100%{transform:translateX(0);opacity:.7}50%{transform:translateX(-230px);opacity:1}}
@keyframes p{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.14);opacity:1}}
@keyframes up{0%{transform:translate(0,0) scale(1);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translate(-16px,-80px) scale(.4);opacity:0}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.g1{animation:a 10s ease-in-out infinite}.g2{animation:b 13s ease-in-out infinite}.g3{animation:a 15s ease-in-out infinite reverse}
.fire{transform-origin:700px 150px;animation:p 4s ease-in-out infinite}
.e1{animation:up 3s ease-in infinite}.e2{animation:up 4s ease-in 1s infinite}.e3{animation:up 2.6s ease-in 2s infinite}
.char{animation:fl 6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><radialGradient id="gf" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#1f8a5a" stop-opacity=".55"/><stop offset=".45" stop-color="#1f8a5a" stop-opacity="0.22000000000000003"/><stop offset=".72" stop-color="#1f8a5a" stop-opacity="0"/></radialGradient><radialGradient id="go" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#7da82f" stop-opacity=".34"/><stop offset=".45" stop-color="#7da82f" stop-opacity="0.136"/><stop offset=".72" stop-color="#7da82f" stop-opacity="0"/></radialGradient><radialGradient id="ga" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#d39a52" stop-opacity=".30"/><stop offset=".45" stop-color="#d39a52" stop-opacity="0.12"/><stop offset=".72" stop-color="#d39a52" stop-opacity="0"/></radialGradient><radialGradient id="f1" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#e4572e" stop-opacity=".6"/><stop offset=".45" stop-color="#e4572e" stop-opacity="0.24"/><stop offset=".72" stop-color="#e4572e" stop-opacity="0"/></radialGradient><radialGradient id="f2" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffb04a" stop-opacity=".5"/><stop offset=".45" stop-color="#ffb04a" stop-opacity="0.2"/><stop offset=".72" stop-color="#ffb04a" stop-opacity="0"/></radialGradient><linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9d05a"/><stop offset="1" stop-color="#d39a52"/></linearGradient></defs><clipPath id="cp"><rect width="860" height="232" rx="16"/></clipPath><rect width="860" height="232" rx="16" fill="#07090a"/><g clip-path="url(#cp)"><g transform="translate(180,0)"><ellipse class="g1" cx="150" cy="262" rx="270" ry="170" fill="url(#gf)"/><ellipse class="g2" cx="420" cy="262" rx="230" ry="140" fill="url(#go)"/><ellipse class="g3" cx="600" cy="272" rx="170" ry="110" fill="url(#ga)"/></g></g><rect x=".5" y=".5" width="859" height="231" rx="16" fill="none" stroke="#9fc356" stroke-opacity=".25"/><rect x="30" y="30" width="4" height="150" rx="2" fill="url(#bar)"/><text class="t" x="56" y="56" font-size="25" font-weight="700" fill="#f1f3e8" text-anchor="start" letter-spacing="-.3">TransactX</text><text class="t" x="820" y="54" font-size="13.5" font-weight="600" fill="#a9d05a" text-anchor="end" >View repository</text><text class="t" x="56" y="80" font-size="14.5" font-weight="600" fill="#d39a52" text-anchor="start" >Enterprise Banking Core and ATM Simulator</text><text class="t" x="56" y="110" font-size="13.5" font-weight="500" fill="#c9d2bd" text-anchor="start" >ACID transfers, ordered-lock deadlock prevention, an immutable double-entry ledger, and</text><text class="t" x="56" y="131" font-size="13.5" font-weight="500" fill="#c9d2bd" text-anchor="start" >a sandbox comparing optimistic and pessimistic locking.</text><circle cx="60" cy="158" r="3.5" fill="#e4572e"/><text class="t" x="72" y="162" font-size="13" font-weight="600" fill="#f0b987" text-anchor="start" >Pessimistic locks: 100% success vs ~15-25% optimistic at 50 concurrent transfers</text><rect x="56" y="180" width="104" height="26" rx="13" fill="#a9d05a" fill-opacity=".1" stroke="#a9d05a" stroke-opacity=".4"/><text class="t" x="108.0" y="197.5" font-size="12.5" font-weight="600" fill="#dfe8c8" text-anchor="middle" >Spring Boot</text><rect x="168" y="180" width="44" height="26" rx="13" fill="#a9d05a" fill-opacity=".1" stroke="#a9d05a" stroke-opacity=".4"/><text class="t" x="190.0" y="197.5" font-size="12.5" font-weight="600" fill="#dfe8c8" text-anchor="middle" >JWT</text><rect x="220" y="180" width="97" height="26" rx="13" fill="#a9d05a" fill-opacity=".1" stroke="#a9d05a" stroke-opacity=".4"/><text class="t" x="268.5" y="197.5" font-size="12.5" font-weight="600" fill="#dfe8c8" text-anchor="middle" >PostgreSQL</text><rect x="325" y="180" width="60" height="26" rx="13" fill="#a9d05a" fill-opacity=".1" stroke="#a9d05a" stroke-opacity=".4"/><text class="t" x="355.0" y="197.5" font-size="12.5" font-weight="600" fill="#dfe8c8" text-anchor="middle" >Redis</text><rect x="393" y="180" width="60" height="26" rx="13" fill="#a9d05a" fill-opacity=".1" stroke="#a9d05a" stroke-opacity=".4"/><text class="t" x="423.0" y="197.5" font-size="12.5" font-weight="600" fill="#dfe8c8" text-anchor="middle" >React</text></svg>