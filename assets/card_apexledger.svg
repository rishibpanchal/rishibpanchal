<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" width="100%" height="auto">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap');
      .bg { fill: #0B0C0E; }
      .card-border { stroke: #232730; stroke-width: 1; fill: none; }
      .num { font-family: 'Space Grotesk', -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #FF4D00; letter-spacing: 1px; }
      .title { font-family: 'Space Grotesk', -apple-system, sans-serif; font-size: 32px; font-weight: 900; fill: #F4F4F5; letter-spacing: -1px; }
      .subtitle { font-family: 'Space Grotesk', -apple-system, sans-serif; font-size: 14px; font-weight: 500; fill: #8E9299; }
      .mono-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; fill: #D4D4D8; }
      .tag-bg { fill: #161920; stroke: #2B303C; stroke-width: 1; }
      .diag-bg { fill: #101217; stroke: #1D212A; stroke-width: 1; }
      .diag-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #A1A1AA; }
      .diag-accent { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; fill: #FF4D00; }
      .diag-box { fill: #14171F; stroke: #2E3442; stroke-width: 1; rx: 4px; }
      .diag-line { stroke: #333948; stroke-width: 1.5; fill: none; }
      .diag-arrow { stroke: #FF4D00; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="960" height="270" rx="10" class="bg" />
  <rect x="0.5" y="0.5" width="959" height="269" rx="9.5" class="card-border" />

  <!-- Left Side: Editorial Details -->
  <g transform="translate(40, 36)">
    <text x="0" y="0" class="num">01 // FINANCIAL CONCURRENCY</text>
    <text x="0" y="34" class="title">APEXLEDGER</text>
    <text x="0" y="58" class="subtitle">Asynchronous trade settlement &amp; tamper-evident ledger</text>

    <!-- Technical Badges -->
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="118" height="22" rx="4" class="tag-bg" />
      <text x="8" y="15" class="mono-tag">JAVA 21 / LOOM</text>

      <rect x="126" y="0" width="96" height="22" rx="4" class="tag-bg" />
      <text x="134" y="15" class="mono-tag">POSTGRESQL</text>

      <rect x="230" y="0" width="138" height="22" rx="4" class="tag-bg" />
      <text x="238" y="15" class="mono-tag">PESSIMISTIC LOCKS</text>
    </g>

    <g transform="translate(0, 130)">
      <text x="0" y="0" class="diag-label" font-size="12px">CORE INVARIANT:</text>
      <text x="0" y="20" class="diag-accent" font-size="12px">Lock accounts in alphabetical order (TX-A &lt; TX-B).</text>
      <text x="0" y="38" class="diag-label">Eliminates circular wait deadlocks under extreme load.</text>
      <text x="0" y="56" class="diag-label">Cryptographic tip hash chaining guarantees ledger immutability.</text>
    </g>
  </g>

  <!-- Right Side: Architectural Blueprint Diagram -->
  <g transform="translate(480, 24)">
    <rect width="440" height="222" rx="6" class="diag-bg" />

    <!-- Top Diagram Label -->
    <text x="20" y="26" class="diag-accent">SYSTEM SCHEMATIC // SHA-256 TIP CHAIN &amp; DLQ</text>

    <!-- Diagram Node: Virtual Thread Ingestion -->
    <rect x="20" y="44" width="110" height="48" rx="4" class="diag-box" />
    <text x="32" y="64" class="diag-label">TRADE STREAM</text>
    <text x="32" y="78" class="diag-accent">Virtual Threads</text>

    <!-- Arrow to Ordered Lock Engine -->
    <path d="M 130 68 L 165 68" class="diag-arrow" marker-end="url(#arrow)" />

    <!-- Diagram Node: Ordered Locks -->
    <rect x="170" y="44" width="125" height="48" rx="4" class="diag-box" />
    <text x="180" y="64" class="diag-label">SORTED LOCKS</text>
    <text x="180" y="78" class="diag-accent">Account A &lt; B</text>

    <!-- Arrow to Ledger & Hash -->
    <path d="M 295 68 L 325 68" class="diag-arrow" />

    <!-- Diagram Node: Tamper Evident Tip -->
    <rect x="330" y="44" width="90" height="48" rx="4" class="diag-box" />
    <text x="340" y="64" class="diag-label">SHA-256</text>
    <text x="340" y="78" class="diag-accent">Tip Chain</text>

    <!-- Error Path to DLQ -->
    <path d="M 232 92 L 232 145" class="diag-line" stroke-dasharray="3 3" />
    <path d="M 232 145 L 260 145" class="diag-arrow" />

    <!-- Diagram Node: DLQ -->
    <rect x="265" y="122" width="155" height="48" rx="4" class="diag-box" />
    <text x="277" y="142" class="diag-label">DLQ // REQUIRES_NEW</text>
    <text x="277" y="156" class="diag-accent">Exp. Backoff Retry (3x)</text>

    <!-- Micro annotations in diagram -->
    <text x="20" y="195" class="diag-label">INSPECTION:</text>
    <text x="100" y="195" class="diag-label">Sum of 20 vaults audits to invariant $20,000,000.00</text>
    <text x="20" y="210" class="diag-label">LATENCY:</text>
    <text x="100" y="210" class="diag-accent">Sub-millisecond unmount on database blocking I/O</text>
  </g>
</svg>
