<svg xmlns="http://www.w3.org/2000/svg" width="860" height="110" viewBox="0 0 860 110"><style>
.t{font-family:Manrope, 'Segoe UI', Helvetica, Arial, sans-serif}
@keyframes a{0%,100%{transform:translateX(0);opacity:.8}50%{transform:translateX(300px);opacity:1}}
@keyframes b{0%,100%{transform:translateX(0);opacity:.7}50%{transform:translateX(-230px);opacity:1}}
@keyframes p{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.14);opacity:1}}
@keyframes up{0%{transform:translate(0,0) scale(1);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translate(-16px,-80px) scale(.4);opacity:0}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.g1{animation:a 10s ease-in-out infinite}.g2{animation:b 13s ease-in-out infinite}.g3{animation:a 15s ease-in-out infinite reverse}
.fire{transform-origin:700px 150px;animation:p 4s ease-in-out infinite}
.e1{animation:up 3s ease-in infinite}.e2{animation:up 4s ease-in 1s infinite}.e3{animation:up 2.6s ease-in 2s infinite}
.char{animation:fl 6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><radialGradient id="gf" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#1f8a5a" stop-opacity=".55"/><stop offset=".45" stop-color="#1f8a5a" stop-opacity="0.22000000000000003"/><stop offset=".72" stop-color="#1f8a5a" stop-opacity="0"/></radialGradient><radialGradient id="go" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#7da82f" stop-opacity=".34"/><stop offset=".45" stop-color="#7da82f" stop-opacity="0.136"/><stop offset=".72" stop-color="#7da82f" stop-opacity="0"/></radialGradient><radialGradient id="ga" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#d39a52" stop-opacity=".30"/><stop offset=".45" stop-color="#d39a52" stop-opacity="0.12"/><stop offset=".72" stop-color="#d39a52" stop-opacity="0"/></radialGradient><radialGradient id="f1" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#e4572e" stop-opacity=".6"/><stop offset=".45" stop-color="#e4572e" stop-opacity="0.24"/><stop offset=".72" stop-color="#e4572e" stop-opacity="0"/></radialGradient><radialGradient id="f2" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffb04a" stop-opacity=".5"/><stop offset=".45" stop-color="#ffb04a" stop-opacity="0.2"/><stop offset=".72" stop-color="#ffb04a" stop-opacity="0"/></radialGradient><linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9d05a"/><stop offset="1" stop-color="#d39a52"/></linearGradient></defs><clipPath id="cp"><rect width="860" height="110" rx="16"/></clipPath><rect width="860" height="110" rx="16" fill="#07090a"/><g clip-path="url(#cp)"><g transform="translate(0,0)"><ellipse class="g1" cx="150" cy="140" rx="270" ry="170" fill="url(#gf)"/><ellipse class="g2" cx="420" cy="140" rx="230" ry="140" fill="url(#go)"/><ellipse class="g3" cx="600" cy="150" rx="170" ry="110" fill="url(#ga)"/></g></g><rect x=".5" y=".5" width="859" height="109" rx="16" fill="none" stroke="#9fc356" stroke-opacity=".25"/><text class="t" x="48" y="62" font-size="24" font-weight="700" fill="#f1f3e8" text-anchor="start" >Get in touch</text><text class="t" x="48" y="90" font-size="14" font-weight="500" fill="#98a48c" text-anchor="start" >Open a repository, or send a message.</text></svg>