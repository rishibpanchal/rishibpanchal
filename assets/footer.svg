<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 130" width="100%" height="auto">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap');
      .bg { fill: #0B0C0E; }
      .border { stroke: #232730; stroke-width: 1; fill: none; }
      .header-mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; fill: #FF4D00; letter-spacing: 1px; }
      .title { font-family: 'Space Grotesk', -apple-system, sans-serif; font-size: 18px; font-weight: 900; fill: #F4F4F5; letter-spacing: -0.5px; }
      .subtext { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #7E8494; }
      .status-dot { fill: #10B981; }
      .nav-pill { fill: #151821; stroke: #2A303D; stroke-width: 1; }
      .nav-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; fill: #E4E4E7; }
    </style>
  </defs>

  <rect width="960" height="130" rx="8" class="bg" />
  <rect x="0.5" y="0.5" width="959" height="129" rx="7.5" class="border" />

  <!-- Left Side: Editorial Prompt -->
  <g transform="translate(36, 30)">
    <text x="0" y="0" class="header-mono">04 // DISPATCH &amp; CONTACT</text>
    <text x="0" y="26" class="title">If something here caught your attention, say hello.</text>
    <text x="0" y="48" class="subtext">Open for systems engineering, concurrency architecture, and quantitative tools.</text>
  </g>

  <!-- Right Side: Status Marker & Navigation Coordinates -->
  <g transform="translate(710, 38)">
    <circle cx="0" cy="0" r="3.5" class="status-dot" />
    <text x="12" y="4" class="header-mono" fill="#10B981">LOCATION: MUMBAI</text>

    <g transform="translate(0, 24)">
      <rect x="0" y="0" width="210" height="28" rx="4" class="nav-pill" />
      <text x="14" y="18" class="nav-text">LINKEDIN // EMAIL // GITHUB</text>
    </g>
  </g>
</svg>
