<svg xmlns="http://www.w3.org/2000/svg" width="860" height="232" viewBox="0 0 860 232"><style>
.t{font-family:Manrope, 'Segoe UI', Helvetica, Arial, sans-serif}
@keyframes a{0%,100%{transform:translateX(0);opacity:.8}50%{transform:translateX(300px);opacity:1}}
@keyframes b{0%,100%{transform:translateX(0);opacity:.7}50%{transform:translateX(-230px);opacity:1}}
@keyframes p{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.14);opacity:1}}
@keyframes up{0%{transform:translate(0,0) scale(1);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translate(-16px,-80px) scale(.4);opacity:0}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.g1{animation:a 10s ease-in-out infinite}.g2{animation:b 13s ease-in-out infinite}.g3{animation:a 15s ease-in-out infinite reverse}
.fire{transform-origin:700px 150px;animation:p 4s ease-in-out infinite}
.e1{animation:up 3s ease-in infinite}.e2{animation:up 4s ease-in 1s infinite}.e3{animation:up 2.6s ease-in 2s infinite}
.char{animation:fl 6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><radialGradient id="gf" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#1f8a5a" stop-opacity=".55"/><stop offset=".45" stop-color="#1f8a5a" stop-opacity="0.22000000000000003"/><stop offset=".72" stop-color="#1f8a5a" stop-opacity="0"/></radialGradient><radialGradient id="go" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#7da82f" stop-opacity=".34"/><stop offset=".45" stop-color="#7da82f" stop-opacity="0.136"/><stop offset=".72" stop-color="#7da82f" stop-opacity="0"/></radialGradient><radialGradient id="ga" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#d39a52" stop-opacity=".30"/><stop offset=".45" stop-color="#d39a52" stop-opacity="0.12"/><stop offset=".72" stop-color="#d39a52" stop-opacity="0"/></radialGradient><radialGradient id="f1" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#e4572e" stop-opacity=".6"/><stop offset=".45" stop-color="#e4572e" stop-opacity="0.24"/><stop offset=".72" stop-color="#e4572e" stop-opacity="0"/></radialGradient><radialGradient id="f2" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffb04a" stop-opacity=".5"/><stop offset=".45" stop-color="#ffb04a" stop-opacity="0.2"/><stop offset=".72" stop-color="#ffb04a" stop-opacity="0"/></radialGradient><linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9d05a"/><stop offset="1" stop-color="#d39a52"/></linearGradient></defs><clipPath id="cp"><rect width="860" height="232" rx="16"/></clipPath><rect width="860" height="232" rx="16" fill="#07090a"/><g clip-path="url(#cp)"><g transform="translate(0,0)"><ellipse class="g1" cx="150" cy="262" rx="270" ry="170" fill="url(#gf)"/><ellipse class="g2" cx="420" cy="262" rx="230" ry="140" fill="url(#go)"/><ellipse class="g3" cx="600" cy="272" rx="170" ry="110" fill="url(#ga)"/></g></g><rect x=".5" y=".5" width="859" height="231" rx="16" fill="none" stroke="#9fc356" stroke-opacity=".25"/><text class="t" x="48" y="54" font-size="22" font-weight="700" fill="#f1f3e8" text-anchor="start" >Working principles</text><rect x="36" y="80" width="188" height="124" rx="12" fill="#a9d05a" fill-opacity=".07" stroke="#a9d05a" stroke-opacity=".3"/><rect x="50" y="96" width="3" height="18" rx="1.5" fill="#d39a52"/><text class="t" x="60" y="110" font-size="14.5" font-weight="700" fill="#f1f3e8" text-anchor="start" >AI proposes, code</text><text class="t" x="60" y="128" font-size="14.5" font-weight="700" fill="#f1f3e8" text-anchor="start" >decides</text><text class="t" x="50" y="158" font-size="12" font-weight="500" fill="#98a48c" text-anchor="start" >Models plan and explain.</text><text class="t" x="50" y="174" font-size="12" font-weight="500" fill="#98a48c" text-anchor="start" >Guardrails and calculators</text><text class="t" x="50" y="190" font-size="12" font-weight="500" fill="#98a48c" text-anchor="start" >do the arithmetic.</text><rect x="236" y="80" width="188" height="124" rx="12" fill="#a9d05a" fill-opacity=".07" stroke="#a9d05a" stroke-opacity=".3"/><rect x="250" y="96" width="3" height="18" rx="1.5" fill="#d39a52"/><text class="t" x="260" y="110" font-size="14.5" font-weight="700" fill="#f1f3e8" text-anchor="start" >Ordered locks</text><text class="t" x="250" y="140" font-size="12" font-weight="500" fill="#98a48c" text-anchor="start" >Accounts lock in a fixed</text><text class="t" x="250" y="156" font-size="12" font-weight="500" fill="#98a48c" text-anchor="start" >order, so concurrent</text><text class="t" x="250" y="172" font-size="12" font-weight="500" fill="#98a48c" text-anchor="start" >transfers cannot deadlock.</text><rect x="436" y="80" width="188" height="124" rx="12" fill="#a9d05a" fill-opacity=".07" stroke="#a9d05a" stroke-opacity=".3"/><rect x="450" y="96" width="3" height="18" rx="1.5" fill="#d39a52"/><text class="t" x="460" y="110" font-size="14.5" font-weight="700" fill="#f1f3e8" text-anchor="start" >Verifiable history</text><text class="t" x="450" y="140" font-size="12" font-weight="500" fill="#98a48c" text-anchor="start" >SHA-256 hash chains make</text><text class="t" x="450" y="156" font-size="12" font-weight="500" fill="#98a48c" text-anchor="start" >any edit to the ledger</text><text class="t" x="450" y="172" font-size="12" font-weight="500" fill="#98a48c" text-anchor="start" >detectable.</text><rect x="636" y="80" width="188" height="124" rx="12" fill="#a9d05a" fill-opacity=".07" stroke="#a9d05a" stroke-opacity=".3"/><rect x="650" y="96" width="3" height="18" rx="1.5" fill="#d39a52"/><text class="t" x="660" y="110" font-size="14.5" font-weight="700" fill="#f1f3e8" text-anchor="start" >Measured, not</text><text class="t" x="660" y="128" font-size="14.5" font-weight="700" fill="#f1f3e8" text-anchor="start" >claimed</text><text class="t" x="650" y="158" font-size="12" font-weight="500" fill="#98a48c" text-anchor="start" >Benchmarks and evaluation</text><text class="t" x="650" y="174" font-size="12" font-weight="500" fill="#98a48c" text-anchor="start" >suites back every</text><text class="t" x="650" y="190" font-size="12" font-weight="500" fill="#98a48c" text-anchor="start" >performance claim.</text></svg>